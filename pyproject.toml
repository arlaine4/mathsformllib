[project]
name = "mathsformllib"
version = "0.1.0"
description = "Home-made math library built while learning ML foundations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathsformllib"]

[tool.pytest.ini_options]
testpaths = ["tests"]